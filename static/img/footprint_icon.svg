<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Soft subtle background circle/glow -->
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4ECDC4" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48D1CC" />
      <stop offset="50%" stop-color="#2EC4B6" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <linearGradient id="whiteRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <g filter="url(#softGlow)">
    <!-- 1. Outer White Embossed Ribbon / Contour -->
    <!-- Curved '?' shaped sole -->
    <path d="M 170 210 C 130 250, 180 340, 240 370 C 290 395, 330 450, 260 475 C 200 495, 170 430, 200 380 C 150 350, 100 270, 130 200 C 170 120, 360 120, 380 230 C 390 280, 330 330, 290 350 C 250 330, 340 270, 330 220 C 315 160, 190 160, 170 210 Z" 
          fill="url(#whiteRim)" 
          stroke="#E2E8F0" 
          stroke-width="6" 
          stroke-linejoin="round"/>

    <!-- 2. Inner Mint Green Flow Ribbon -->
    <path d="M 185 205 C 205 160, 305 160, 320 215 C 330 255, 275 305, 245 335 C 190 385, 205 450, 245 445 C 275 440, 260 390, 225 365 C 175 330, 145 255, 185 205 Z" 
          fill="url(#mintGrad)" />

    <!-- 3. Toes (5 Oval Teardrops with white embossed border & mint fill) -->
    <!-- Big Toe (Rightmost) -->
    <g transform="translate(370, 125) rotate(25)">
      <ellipse cx="0" cy="0" rx="34" ry="46" fill="url(#whiteRim)" stroke="#E2E8F0" stroke-width="5" />
      <ellipse cx="0" cy="0" rx="24" ry="36" fill="url(#mintGrad)" />
    </g>

    <!-- Toe 2 -->
    <g transform="translate(305, 75) rotate(10)">
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="url(#whiteRim)" stroke="#E2E8F0" stroke-width="5" />
      <ellipse cx="0" cy="0" rx="19" ry="29" fill="url(#mintGrad)" />
    </g>

    <!-- Toe 3 (Middle) -->
    <g transform="translate(235, 58) rotate(-5)">
      <ellipse cx="0" cy="0" rx="25" ry="34" fill="url(#whiteRim)" stroke="#E2E8F0" stroke-width="5" />
      <ellipse cx="0" cy="0" rx="17" ry="25" fill="url(#mintGrad)" />
    </g>

    <!-- Toe 4 -->
    <g transform="translate(168, 75) rotate(-20)">
      <ellipse cx="0" cy="0" rx="23" ry="30" fill="url(#whiteRim)" stroke="#E2E8F0" stroke-width="5" />
      <ellipse cx="0" cy="0" rx="15" ry="22" fill="url(#mintGrad)" />
    </g>

    <!-- Little Toe (Leftmost) -->
    <g transform="translate(110, 120) rotate(-35)">
      <ellipse cx="0" cy="0" rx="20" ry="26" fill="url(#whiteRim)" stroke="#E2E8F0" stroke-width="5" />
      <ellipse cx="0" cy="0" rx="13" ry="18" fill="url(#mintGrad)" />
    </g>
  </g>
</svg>
